<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Кулькосвіт</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&display=swap">
<style>
:root{--bg:#5aa9e6;--bar:#3b2a1a;--bar2:#5a4330;--slot:#8b8b8b;--slot-hi:#fff;--ink:#fff;--muted:#d9e6f2;--gold:#ffcf3f;
  --t0:#2fbf4f;--t1:#e5403a;
  --f:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--fd:"Unbounded",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f);font-weight:700;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}

/* ---------- avatar picker */
#pick{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;padding:16px;
  background:linear-gradient(#79c3ff,#cdeeff 70%,#6cbf3f 70%,#6cbf3f 74%,#8a6240 74%)}
#pick h1{margin:0;font-family:var(--fd);font-weight:900;font-size:clamp(2rem,8vw,4.5rem);letter-spacing:.04em;color:#fff;
  text-shadow:4px 4px 0 #2d6b1f,-2px -2px 0 #2d6b1f,2px -2px 0 #2d6b1f,-2px 2px 0 #2d6b1f}
.avs{display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(8px,2vw,18px);max-width:min(900px,100%)}
@media (max-aspect-ratio:1/1){.avs{grid-template-columns:repeat(4,1fr)}}
.av{width:clamp(64px,13vw,120px);aspect-ratio:1;border:0;padding:10%;background:#00000030;border-radius:6px;
  box-shadow:inset -4px -4px 0 #0003,inset 4px 4px 0 #fff4;transition:transform .12s}
.av:active,.av.on{transform:scale(1.12)}
.av canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.hand{font-size:clamp(2rem,6vw,3.5rem);animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px)}}

/* ---------- game */
#game{position:fixed;inset:0;display:flex;flex-direction:column}
#top{display:none}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#2b1d12;position:relative}
#world,#world3{display:block;touch-action:none;box-shadow:0 0 0 4px #000}
#world{image-rendering:pixelated}
#bar{display:flex;justify-content:center;align-items:center;gap:clamp(4px,1.2vw,12px);padding:10px 10px calc(10px + env(safe-area-inset-bottom));
  background:var(--bar);border-top:4px solid #000}
.tool{--t:clamp(48px,min(10.5vw,12vh),86px);flex:none;width:var(--t);height:var(--t);border:4px solid #000;background:var(--slot);padding:calc(var(--t) * .1);position:relative;
  box-shadow:inset -4px -4px 0 #555,inset 4px 4px 0 #c6c6c6;border-radius:2px}
.tool canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.tool.on{outline:5px solid var(--slot-hi);outline-offset:1px;transform:translateY(-6px)}
.me{position:absolute;left:10px;top:10px;width:clamp(48px,7vw,70px);aspect-ratio:1;border:5px solid #000;background:#ffffff55;padding:4px;border-radius:4px;z-index:3}
.me canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.me.t0{border-color:var(--t0);background:#2fbf4f66}.me.t1{border-color:var(--t1);background:#e5403a66}
.me .tag{position:absolute;right:-14px;bottom:-14px;font-size:clamp(20px,3vw,30px);filter:drop-shadow(0 2px 0 #000)}
.view{position:absolute;right:10px;top:10px;z-index:3;border:3px solid #000;background:var(--bar2);padding:6px 10px;font-size:clamp(14px,2vw,20px);font-weight:700;
  box-shadow:inset -3px -3px 0 #0005,inset 3px 3px 0 #fff2}
.net{position:absolute;right:12px;bottom:12px;width:18px;height:18px;border-radius:50%;background:#e53935;border:3px solid #000;z-index:3}
.net.ok{display:none}
#hint{position:absolute;left:50%;top:22%;font-size:clamp(3rem,9vw,6rem);transform:translateX(-50%);pointer-events:none;animation:bob 1s ease-in-out infinite;z-index:2}

/* HUD: level stars, chest progress, sand clock */
#hud{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:clamp(8px,1.6vw,18px);align-items:center;z-index:3;
  background:#000b;border:3px solid #000;padding:6px 14px;border-radius:8px;pointer-events:none;max-width:calc(100% - 170px);flex-wrap:wrap;justify-content:center}
#hud .stars{display:flex;gap:2px;font-size:clamp(16px,2.4vw,28px);line-height:1}
#hud .stars span{filter:grayscale(1) brightness(.55);opacity:.7}
#hud .stars span.done{filter:none;opacity:1}
#hud .stars span.now{filter:none;opacity:1;animation:pulse 1s ease-in-out infinite;display:inline-block}
@keyframes pulse{50%{transform:scale(1.35)}}
#hud .ic{font-size:clamp(18px,2.6vw,30px)}
#hud .barbox{display:flex;align-items:center;gap:6px}
#hud .bar{width:clamp(100px,17vw,260px);height:clamp(22px,3vw,34px);background:#3b2a1a;border:3px solid #000;position:relative;overflow:hidden;border-radius:4px}
#hud .bar i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#ff4d4d,#ffb84d,#fff04d,#5ee35e,#4dc3ff,#a64dff);transition:width .25s}
#hud .bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(14px,2vw,22px);font-weight:800;
  text-shadow:0 0 3px #000,1px 1px 0 #000,-1px -1px 0 #000;font-variant-numeric:tabular-nums}
#hud .bar.t{width:clamp(64px,8vw,120px)}
#hud .bar.t i{background:#ffd54f;transition:none}
#hud .bar.t.low i{background:#ff5252}
#hud .wait{font-size:clamp(14px,2vw,22px)}

/* banners: team reveal, results */
#banner{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:15;background:#0007;pointer-events:none}
#banner .in{background:var(--c,#333);border:6px solid #000;box-shadow:inset -8px -8px 0 #0004,inset 8px 8px 0 #fff3;padding:3vh 5vw;text-align:center;
  animation:pop .35s cubic-bezier(.3,1.6,.5,1);max-width:92vw}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
#banner .big{font-size:min(22vw,22vh);line-height:1}
#banner .row{display:flex;align-items:center;justify-content:center;gap:3vw}
#banner canvas{width:min(20vw,20vh);height:min(20vw,20vh);image-rendering:pixelated}
#banner h2{margin:1vh 0 0;font-family:var(--fd);font-size:clamp(1.6rem,6vw,4rem);text-shadow:3px 3px 0 #000}
#banner p{margin:.5vh 0 0;font-size:clamp(1rem,3vw,2rem);text-shadow:2px 2px 0 #000}

#freeze{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;gap:6vw;z-index:20;font-size:min(28vw,40vh)}
#freeze span{animation:bob 1.2s ease-in-out infinite}
#freeze span+span{animation-delay:.3s}

/* ---------- board (projector) */
body.board #top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:8px 16px;background:var(--bar);border-bottom:4px solid #000}
.join{font-size:clamp(1.1rem,2.4vw,2rem);font-weight:800;letter-spacing:.02em}
.join small{display:block;font-size:.5em;color:var(--muted);font-weight:500}
.tbtns{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.tbtns button{background:var(--bar2);border:3px solid #000;padding:7px 10px;font-size:.95rem;box-shadow:inset -3px -3px 0 #0005,inset 3px 3px 0 #fff2}
.tbtns button.go{background:#2e7d32}
.tbtns button.on{background:#d84315}
.teams{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;width:100%;min-height:34px;font-size:1.1rem}
.team{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:3px 8px;border:3px solid #000;border-radius:4px}
.team.t0{background:#2fbf4f55}.team.t1{background:#e5403a55}
.team canvas{width:28px;height:28px;image-rendering:pixelated}
.teams .info{color:var(--muted);font-size:1rem}
body.board .tool{--t:clamp(44px,min(5.5vw,8vh),70px)}
body.board #bar{padding:6px}
</style>
</head>
<body>
<section id="pick" hidden>
  <h1>КУЛЬКОСВІТ</h1>
  <div class="avs" id="avs"></div>
  <div class="hand" aria-hidden="true">👆</div>
</section>

<section id="game" hidden>
  <div id="top">
    <div class="join"><small>Заходьте в браузері:</small><span id="joinUrl"></span></div>
    <div class="tbtns" id="tbtns" hidden>
      <button data-a="start" class="go" id="bStart">▶ Почати гру</button>
      <button data-a="next">⏭ Наступний рівень</button>
      <button data-a="shuffle">🔀 Перемішати команди</button>
      <button data-a="freeze" id="bFreeze">✋ Завмерли</button>
      <button data-a="mute" id="bMute">🔊 Звук на планшетах</button>
      <button data-a="clear">🧹 Прибрати кульки</button>
      <button data-a="party">🎉 Свято</button>
      <button data-a="newclass">🆕 Новий клас</button>
    </div>
    <div class="teams" id="teams"></div>
  </div>
  <div id="stage">
    <div id="hud">
      <div class="stars" id="stars" title="Рівні"></div>
      <div class="barbox" id="goalBox"><span class="ic">🧺</span><div class="bar"><i id="goalFill"></i><span id="goalTxt"></span></div></div>
      <div class="barbox" id="timeBox"><span class="ic">⏳</span><div class="bar t" id="timeBar"><i id="timeFill"></i><span id="timeTxt"></span></div></div>
      <div class="wait" id="waitBox"></div>
    </div>
    <button class="me" id="meBtn" aria-label="Змінити звірятко"><canvas id="meIcon" width="10" height="10"></canvas><span class="tag" id="meTag"></span></button>
    <button class="view" id="viewBtn" hidden>2D</button>
    <div class="net" id="net" title="Немає зв'язку з вчительським ноутбуком"></div>
    <canvas id="world"></canvas>
    <canvas id="world3" hidden></canvas>
    <div id="hint" hidden>👆</div>
  </div>
  <div id="bar"></div>
</section>
<div id="banner" hidden><div class="in" id="bnIn"></div></div>
<div id="freeze" hidden><span>✋</span><span>✋</span></div>

<script>
/*MODE*/
(() => {
"use strict";
const MODE = window.MODE || "kid";
const BOARD = MODE === "board";
const TEACHER = !!window.TEACHER && BOARD;
const W = 48, H = 27, R = 0.42, SKY = 3; // balls are born in the top SKY rows (same as the server)
const LS = "kulky.";
const store = {
  get(k) { try { return localStorage.getItem(LS + k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(LS + k, v); } catch (e) {} },
};
if (BOARD) document.body.classList.add("board");
const TEAM = [
  { name: "Збирачі", icon: "🧺", color: "#2fbf4f", tools: ["b", "G", "W", "J", "d"], say: "Кидай кульки в скриню!" },
  { name: "Заважайки", icon: "🧱", color: "#e5403a", tools: ["S", "A", "T", "d"], say: "Не дай їм наповнити скриню, поки ⏳ не скінчиться!" },
];
const ALL_TOOLS = ["b", "G", "S", "W", "J", "A", "T", "d"];

// ------------------------------------------------------------ art
const COLORS = ["#e53935", "#fb8c00", "#fdd835", "#9ccc65", "#2e9e4f", "#26c6da", "#1e88e5", "#8e44c9",
                "#f48fb1", "#8d5a3b", "#f5f5f5", "#37474f", "rainbow"];
const PAL = { k: "#1a1a1a", w: "#ffffff", p: "#f8a5c2", o: "#ff9800", y: "#ffe14d", r: "#e53935", g: "#7a7a7a", s: "#ffcc99", n: "#6d4c2f" };
const SPRITES = [
  { a: "#e53935", rows: ["..k....k..", "...k..k...", "..kkkkkk..", ".kwkkkkwk.", ".kkkkkkkk.", "aaaakkaaaa", "akaakkaaka", "aaaakkakaa", "akaakkaaaa", ".aaakkaaa."] }, // ladybug
  { a: "#fb8c00", rows: ["a........a", "aw......wa", "aaaaaaaaaa", "aaaaaaaaaa", "akkaaaakka", "akwaaaakwa", "wwaaaaaaww", ".wwwkkwww.", "..wwwwww..", "...wwww..."] }, // fox
  { a: "#fdd835", rows: ["....aa....", "...aa.....", ".aaaaaaaa.", "aaaaaaaaaa", "akkaaaakka", "akwaaaakwa", "aaaaooaaaa", "aaaooooaaa", "aaaaooaaaa", ".aaaaaaaa."] }, // chick
  { a: "#9ccc65", b: "#558b2f", rows: ["..b..b..b.", ".aaaaaaaa.", "aaaaaaaaaa", "akkaaaaaaa", "akwaaaaaaa", "aaaaaaaaaa", "aaaaaaaaaa", "awawawawaa", "aaaaaaaaaa", ".aaaaaaaa."] }, // dino
  { a: "#2e9e4f", rows: [".www..www.", ".wkk..wkk.", ".wkk..wkk.", "aaaaaaaaaa", "aaaaaaaaaa", "aaaaaaaaaa", "akaaaaaaka", "aakkkkkkaa", "aaaaaaaaaa", ".aaaaaaaa."] }, // frog
  { a: "#26c6da", b: "#90a4ae", rows: ["....r.....", "....b.....", "bbbbbbbbbb", "baaaaaaaab", "bawwaawwab", "bawkaawkab", "baaaaaaaab", "baykykykab", "baaaaaaaab", "bbbbbbbbbb"] }, // robot
  { a: "#1e88e5", rows: ["a........a", "aa......aa", "aaaaaaaaaa", "aaaaaaaaaa", "akkaaaakka", "akwaaaakwa", "aaaappaaaa", "kaaakkaaak", "aaaaaaaaaa", ".aaaaaaaa."] }, // cat
  { a: "#8e44c9", b: "#d1a6f0", rows: ["a........a", "aa......aa", "aaaaaaaaaa", "awwwaawwwa", "awkwaawkwa", "awwwaawwwa", "aaaaooaaaa", "abaaooaaba", "abbbbbbbba", ".bbbbbbbb."] }, // owl
  { a: "#f48fb1", b: "#d9578b", rows: [".aa....aa.", "aaaa..aaaa", "aaaaaaaaaa", "aaaaaaaaaa", "akkaaaakka", "aaaaaaaaaa", "aaabbbbaaa", "aaabkkbaaa", "aaabbbbaaa", ".aaaaaaaa."] }, // pig
  { a: "#8d5a3b", b: "#d7a77a", rows: ["aa......aa", "abaaaaaaba", "aaaaaaaaaa", "aaaaaaaaaa", "akkaaaakka", "aaaaaaaaaa", "aaabbbbaaa", "aaabkkbaaa", "aaaabbaaaa", ".aaaaaaaa."] }, // bear
  { a: "#f5f5f5", rows: ["kk......kk", "kkaaaaaakk", "aaaaaaaaaa", "akkkaakkka", "akwkaakwka", "akkkaakkka", "aaaaaaaaaa", "aaaakkaaaa", "aaaaaaaaaa", ".aaaaaaaa."] }, // panda
  { a: "#37474f", rows: [".aaaaaaaa.", "aaaaaaaaaa", "aawwaawwaa", "awkwwwwkwa", "awwwwwwwwa", "awwwoowwwa", "awwwoowwwa", "aawwwwwwaa", "aaaaaaaaaa", ".aaaaaaaa."] }, // penguin
  { a: "#ffcc99", rows: ["y.y.yy.y.y", "yyyyyyyyyy", "yryyyyyryy", "aaaaaaaaaa", "akkaaaakka", "aaaaaaaaaa", "apaaaaaapa", "aakaaaakaa", "aaakkkkaaa", ".aaaaaaaa."] }, // teacher
];
const spriteCache = {};
function sprite(i, team) { // 10x10 face, or 12x12 with a team-coloured frame
  const key = i + ":" + (team ?? "");
  if (spriteCache[key]) return spriteCache[key];
  const framed = team === 0 || team === 1, o = framed ? 1 : 0;
  const c = document.createElement("canvas"); c.width = c.height = 10 + 2 * o;
  const x = c.getContext("2d"), s = SPRITES[i];
  if (framed) { x.fillStyle = TEAM[team].color; x.fillRect(0, 0, 12, 12); x.fillStyle = "#fff"; x.fillRect(1, 1, 10, 10); }
  s.rows.forEach((row, j) => [...row].forEach((ch, k) => {
    if (ch === ".") return;
    x.fillStyle = ch === "a" ? s.a : ch === "b" ? s.b : PAL[ch];
    x.fillRect(k + o, j + o, 1, 1);
  }));
  return (spriteCache[key] = c);
}
function drawSprite(canvas, i, team) {
  const x = canvas.getContext("2d"); x.imageSmoothingEnabled = false;
  x.clearRect(0, 0, canvas.width, canvas.height); x.drawImage(sprite(i, team), 0, 0, canvas.width, canvas.height);
}

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const TEX = {};
function texture(ch) {
  if (TEX[ch]) return TEX[ch];
  const c = document.createElement("canvas"); c.width = c.height = 16;
  const x = c.getContext("2d"), r = rng(ch.charCodeAt(0) * 7919);
  const px = (i, j, col) => { x.fillStyle = col; x.fillRect(i, j, 1, 1); };
  const pick = a => a[Math.floor(r() * a.length)];
  const fill = cols => { for (let j = 0; j < 16; j++) for (let i = 0; i < 16; i++) px(i, j, pick(cols)); };
  const DIRT = ["#866043", "#79553a", "#966c4a", "#6b4a33", "#8a6446"];
  switch (ch) {
    case "D": fill(DIRT); break;
    case "G": {
      fill(DIRT);
      for (let i = 0; i < 16; i++) {
        const h = 3 + Math.floor(r() * 2.4);
        for (let j = 0; j < h; j++) px(i, j, pick(["#5fa83a", "#6cbf3f", "#549a33", "#79c94a"]));
      }
      break;
    }
    case "g": fill(["#5fa83a", "#6cbf3f", "#549a33", "#79c94a"]); break; // grass top (3D)
    case "S": fill(["#8a8a8a", "#7d7d7d", "#969696", "#7a7a7a", "#8f8f8f"]);
      for (let n = 0; n < 7; n++) { const i = Math.floor(r() * 14), j = Math.floor(r() * 15); px(i, j, "#5f5f5f"); px(i + 1, j, "#6a6a6a"); }
      break;
    case "B": fill(["#2b2b2b", "#4a4a4a", "#3a3a3a", "#5c5c5c", "#1d1d1d"]); break;
    case "W": {
      const base = ["#b8945f", "#a7834f", "#c29f68", "#af8b57"];
      for (let j = 0; j < 16; j++) for (let i = 0; i < 16; i++) px(i, j, j % 4 === 3 ? "#6b4f2a" : pick(base));
      for (let j = 0; j < 4; j++) { const s = (j * 7 + 3) % 16; for (let k = 0; k < 3; k++) px(s, j * 4 + k, "#7d5c33"); }
      break;
    }
    case "L":
      for (let j = 0; j < 16; j++) for (let i = 0; i < 16; i++) if (r() > 0.12) px(i, j, pick(["#2e7d32", "#388e3c", "#1b5e20", "#43a047"]));
      break;
    case "J":
      x.fillStyle = "rgba(110,214,80,.82)"; x.fillRect(0, 0, 16, 16);
      x.fillStyle = "rgba(60,150,40,.95)"; x.fillRect(0, 0, 16, 1); x.fillRect(0, 15, 16, 1); x.fillRect(0, 0, 1, 16); x.fillRect(15, 0, 1, 16);
      x.fillStyle = "rgba(170,240,140,.9)"; x.fillRect(4, 4, 8, 8);
      x.fillStyle = "rgba(90,190,60,.95)"; x.fillRect(4, 4, 8, 1); x.fillRect(4, 11, 8, 1); x.fillRect(4, 4, 1, 8); x.fillRect(11, 4, 1, 8);
      px(6, 6, "#fff"); px(7, 6, "#fff"); px(6, 7, "#fff");
      break;
    case "A":
      x.fillStyle = "rgba(205,238,255,.28)"; x.fillRect(0, 0, 16, 16);
      x.fillStyle = "rgba(255,255,255,.95)"; x.fillRect(0, 0, 16, 1); x.fillRect(0, 15, 16, 1); x.fillRect(0, 0, 1, 16); x.fillRect(15, 0, 1, 16);
      for (let k = 0; k < 4; k++) { px(3 + k, 7 - k, "rgba(255,255,255,.85)"); px(9 + k, 12 - k, "rgba(255,255,255,.7)"); }
      break;
    case "T": {
      for (let j = 0; j < 16; j++) for (let i = 0; i < 16; i++) px(i, j, (i % 4 < 2) ? "#db3b2f" : "#b8261c");
      x.fillStyle = "#eeeeee"; x.fillRect(0, 5, 16, 6);
      const L = { T: ["###", ".#.", ".#.", ".#."], N: ["#.#", "###", "###", "#.#"] };
      ["T", "N", "T"].forEach((ch2, n) => L[ch2].forEach((row, j) => [...row].forEach((v, i) => v === "#" && px(2 + n * 4 + i, 6 + j, "#1a1a1a"))));
      break;
    }
    default: fill(["#ff00ff"]);
  }
  return (TEX[ch] = c);
}
const PICKAXE = ["...cccc...", ".cc.nn.cc.", "c...nn...c", "....nn....", "....nn....", "....nn....", "....nn....", "....nn...."];
function toolIcon(canvas, t, myCol) {
  const x = canvas.getContext("2d"); x.imageSmoothingEnabled = false;
  const S = canvas.width; x.clearRect(0, 0, S, S);
  if (t === "b") {
    [[.34, .62, .26], [.68, .62, .26], [.51, .32, .26]].forEach(([cx, cy, rr]) => {
      x.drawImage(ballSprite(myCol, 64), (cx - rr) * S, (cy - rr) * S, rr * 2 * S, rr * 2 * S);
    });
  } else if (t === "d") {
    x.save(); x.translate(S / 2, S / 2); x.rotate(-Math.PI / 4); const u = S / 11;
    PICKAXE.forEach((row, j) => [...row].forEach((ch, i) => { if (ch === ".") return;
      x.fillStyle = ch === "c" ? "#5fd3e0" : "#7a5230"; x.fillRect((i - 5) * u, (j - 4) * u, u + .5, u + .5); }));
    x.restore();
  } else {
    x.drawImage(texture(t), 0, 0, S, S);
  }
}
const ballCache = {};
function ballSprite(col, size) {
  const key = col + "@" + size;
